{% extends "layout.html" %}

{% block title %}Edit Subject - StudentIQ{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Subject</h1>
</div>

<div class="card">
    {% if error %}
        <p class="error-text">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label for="name">Subject Name</label>
            <input type="text" id="name" name="name" value="{{ subject.name }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="code">Code (optional)</label>
            <input type="text" id="code" name="code" value="{{ subject.code or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>

    <p style="margin-top:15px; font-size: 14px;">
        <a href="{{ url_for('subjects.list_subjects') }}">← Back to Subjects</a>
    </p>
</div>
{% endblock %}
