<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subject - StudentIQ</title>
</head>
<body>

    <h1>Edit Subject</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="name">Subject name:</label>
        <input type="text" id="name" name="name" value="{{ subject.name }}" required>

        <br><br>

        <label for="code">Code (optional):</label>
        <input type="text" id="code" name="code" value="{{ subject.code or '' }}">

        <br><br>

        <button type="submit">Save changes</button>

    </form>

    <p>
        <a href="{{ url_for('subjects.list_subjects') }}">Back to subjects</a>
    </p>

</body>
</html>
