<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudentIQ</title>
</head>
<body>

    <h1>Welcome, {{ user.name }}!</h1>

    <p>Email: {{ user.email }}</p>

    <p>You are successfully logged in to StudentIQ.</p>

    <p>Subjects: {{ subject_count }}</p>
    <p>Overall Attendance: {{ overall_attendance }}%</p>

    <p>
        <a href="{{ url_for('subjects.list_subjects') }}">Subjects</a>
        |
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </p>

</body>
</html>
